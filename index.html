<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GoSkill</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }


    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px 40px;
      background: #ffffff;
    }


    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 24px;
      color: #111111;
    }


    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }


    .search {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #bbbbbb;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111111;
      font-size: 16px;
      outline: none;
    }


    .search:focus {
      background: #ffffff;
      border-color: #111111;
    }


    .search-button {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }


    h2 {
      font-size: 21px;
      margin-bottom: 16px;
    }


    .skills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }


    .skill {
      padding: 16px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      background: #f2f2f2;
      color: #111111;
      cursor: pointer;
      font-size: 15px;
    }


    .skill:hover {
      background: #111111;
      color: #ffffff;
    }


    .description {
      margin-bottom: 20px;
      color: #555555;
      line-height: 1.5;
    }


    .primary-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }


    .primary-button:hover {
      background: #333333;
    }


    .page {
      display: none;
    }


    .page.active {
      display: block;
    }


    .back {
      border: none;
      background: none;
      color: #555555;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 15px;
    }


    .field {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      background: #f7f7f7;
      color: #111111;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }


    .field:focus {
      background: #ffffff;
      border-color: #111111;
    }


    textarea.field {
      min-height: 120px;
      resize: vertical;
    }


    .message {
      margin-top: 14px;
      font-size: 14px;
      color: #555555;
    }


    .profile-card {
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }


    .profile-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }


    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
    }


    .profile-name {
      font-size: 18px;
      font-weight: 700;
    }


    .profile-skill {
      margin-top: 3px;
      color: #666666;
      font-size: 14px;
    }


    .profile-description {
      margin-bottom: 14px;
      color: #444444;
      font-size: 14px;
      line-height: 1.5;
    }


    .price-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }


    .price {
      padding: 7px 10px;
      border-radius: 8px;
      background: #eeeeee;
      color: #222222;
      font-size: 13px;
      font-weight: 600;
    }

  </style>

</head>


<body>


<div class="app">


  <!-- HOME -->

  <section
    id="homePage"
    class="page active"
  >

    <div class="logo">
      GoSkill
    </div>


    <div class="search-container">

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Search for a skill or profession..."
      >

      <button
        class="search-button"
        id="searchButton"
      >
        Search
      </button>

    </div>


    <h2>
      Popular Skills
    </h2>


    <div class="skills">

      <button
        class="skill"
        onclick="searchSkill('Video Editor')"
      >
        Video Editor
      </button>


      <button
        class="skill"
        onclick="searchSkill('Graphic Designer')"
      >
        Graphic Designer
      </button>


      <button
        class="skill"
        onclick="searchSkill('Developer')"
      >
        Developer
      </button>


      <button
        class="skill"
        onclick="searchSkill('Photographer')"
      >
        Photographer
      </button>

    </div>


    <p class="description">
      Find the right person for your project.
    </p>


    <button
      class="primary-button"
      onclick="showPage('profilePage')"
    >
      Offer Your Skill
    </button>

  </section>



  <!-- CREATE PROFILE -->

  <section
    id="profilePage"
    class="page"
  >

    <button
      class="back"
      onclick="showPage('homePage')"
    >
      ← Back
    </button>


    <h2>
      Create Your Profile
    </h2>


    <br>


    <input
      id="name"
      class="field"
      type="text"
      placeholder="Enter your full name"
    >


    <input
      id="skill"
      class="field"
      type="text"
      placeholder="What is your skill or profession?"
    >


    <textarea
      id="description"
      class="field"
      placeholder="Tell people about your skill"
    ></textarea>


    <input
      id="hourlyPrice"
      class="field"
      type="number"
      placeholder="Hourly price"
    >


    <input
      id="projectPrice"
      class="field"
      type="number"
      placeholder="Project price"
    >


    <button
      class="primary-button"
      onclick="createProfile()"
    >
      Create Profile
    </button>


    <p
      id="profileMessage"
      class="message"
    ></p>

  </section>



  <!-- RESULTS -->

  <section
    id="resultsPage"
    class="page"
  >

    <button
      class="back"
      onclick="showPage('homePage')"
    >
      ← Back
    </button>


    <h2>
      People on GoSkill
    </h2>


    <br>


    <div
      id="profilesList"
    ></div>

  </section>


</div>



<script>


/* =========================
   SUPABASE
   ========================= */


const SUPABASE_URL =
  "https://ffovbypaoltxuuycppgo.supabase.co/rest/v1/";


const SUPABASE_KEY =
  "sb_publishable_SNuI9r78c55zT8EgryTK_A_bLrkpuUQ
";



/* =========================
   PAGE NAVIGATION
   ========================= */


function showPage(pageId) {

  document
    .querySelectorAll(".page")
    .forEach(function(page) {

      page.classList.remove(
        "active"
      );

    });


  document
    .getElementById(pageId)
    .classList.add("active");


  window.scrollTo(0, 0);

}



/* =========================
   SEARCH BUTTON
   ========================= */


document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    function() {

      var skill =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim();


      if (skill !== "") {

        searchSkill(skill);

      }

    }
  );



/* =========================
   ENTER KEY
   ========================= */


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();


        var skill =
          document
            .getElementById(
              "searchInput"
            )
            .value
            .trim();


        if (skill !== "") {

          searchSkill(skill);

        }

      }

    }
  );



/* =========================
   CREATE PROFILE
   ========================= */


async function createProfile() {


  var name =
    document
      .getElementById("name")
      .value
      .trim();


  var skill =
    document
      .getElementById("skill")
      .value
      .trim();


  var description =
    document
      .getElementById("description")
      .value
      .trim();


  var hourlyPrice =
    document
      .getElementById("hourlyPrice")
      .value;


  var projectPrice =
    document
      .getElementById("projectPrice")
      .value;


  var message =
    document
      .getElementById(
        "profileMessage"
      );


  if (
    name === "" ||
    skill === ""
  ) {

    message.textContent =
      "Please enter your name and skill.";

    return;

  }


  message.textContent =
    "Saving profile...";


  try {


    var response =
      await fetch(
        SUPABASE_URL +
        "/profiles",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              name: name,

              skill: skill,

              description:
                description,

              hourly_price:
                hourlyPrice
                ? Number(
                    hourlyPrice
                  )
                : null,

              project_price:
                projectPrice
                ? Number(
                    projectPrice
                  )
                : null,

              created_at:
                new Date()
                  .toISOString()

            })

        }
      );


    if (
      !response.ok
    ) {

      var error =
        await response.text();


      console.error(
        "Supabase error:",
        error
      );


      message.textContent =
        "Could not save profile. Check the database settings.";

      return;

    }


    message.textContent =
      "Profile created successfully!";


    document
      .getElementById("name")
      .value = "";


    document
      .getElementById("skill")
      .value = "";


    document
      .getElementById(
        "description"
      )
      .value = "";


    document
      .getElementById(
        "hourlyPrice"
      )
      .value = "";


    document
      .getElementById(
        "projectPrice"
      )
      .value = "";


  }
  catch(error) {

    console.error(
      "Connection error:",
      error
    );


    message.textContent =
      "Connection error. Please try again.";

  }

}



/* =========================
   SEARCH PROFILES
   ========================= */


async function searchSkill(
  skill
) {


  showPage(
    "resultsPage"
  );


  var list =
    document
      .getElementById(
        "profilesList"
      );


  list.innerHTML =
    "Searching...";


  try {


    var url =
      SUPABASE_URL +
      "/profiles?select=*&skill=ilike." +
      encodeURIComponent(
        "*" +
        skill +
        "*"
      );


    console.log(
      "Search URL:",
      url
    );


    var response =
      await fetch(
        url,
        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }
      );


    if (
      !response.ok
    ) {


      var error =
        await response.text();


      console.error(
        "Search error:",
        error
      );


      list.innerHTML =
        "<p>Could not load profiles.</p>";

      return;

    }


    var profiles =
      await response.json();


    console.log(
      "Profiles found:",
      profiles
    );


    displayProfiles(
      profiles
    );


  }
  catch(error) {


    console.error(
      "Search connection error:",
      error
    );


    list.innerHTML =
      "<p>Could not load profiles.</p>";

  }

}



/* =========================
   DISPLAY PROFILES
   ========================= */


function displayProfiles(
  profiles
) {


  var list =
    document
      .getElementById(
        "profilesList"
      );


  if (
    !profiles ||
    profiles.length === 0
  ) {

    list.innerHTML =
      "<p>No profiles found yet.</p>";

    return;

  }


  list.innerHTML =
    "";


  profiles.forEach(
    function(profile) {


      var card =
        document
          .createElement(
            "div"
          );


      card.className =
        "profile-card";


      var firstLetter =
        profile.name
        ? profile.name
            .charAt(0)
            .toUpperCase()
        : "?";


      card.innerHTML =

        '<div class="profile-top">' +

          '<div class="profile-avatar">' +
            escapeHtml(
              firstLetter
            ) +
          '</div>' +

          '<div>' +

            '<div class="profile-name">' +
              escapeHtml(
                profile.name
              ) +
            '</div>' +

            '<div class="profile-skill">' +
              escapeHtml(
                profile.skill
              ) +
            '</div>' +

          '</div>' +

        '</div>' +


        '<div class="profile-description">' +
          escapeHtml(
            profile.description || ""
          ) +
        '</div>' +


        '<div class="price-row">' +


          (
            profile.hourly_price
            ?

            '<div class="price">' +
              '₹' +
              profile.hourly_price +
              '/hr' +
            '</div>'

            : ""
          ) +


          (
            profile.project_price
            ?

            '<div class="price">' +
              '₹' +
              profile.project_price +
              ' project' +
            '</div>'

            : ""
          ) +


        '</div>';


      list.appendChild(
        card
      );

    }
  );

}



/* =========================
   HTML SAFETY
   ========================= */


function escapeHtml(
  value
) {


  var div =
    document
      .createElement(
        "div"
      );


  div.textContent =
    value || "";


  return div.innerHTML;

}


</script>


</body>

</html>
