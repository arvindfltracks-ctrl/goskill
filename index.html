<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GoSkill</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }


    .app {
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      background: #ffffff;
      padding: 24px 18px 40px;
    }


    /* LOGO */

    .logo {
      font-size: 30px;
      font-weight: 800;
      color: #111111;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }


    /* SEARCH */

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }


    .search {
      flex: 1;
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #bdbdbd;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111111;
      font-size: 16px;
      outline: none;
    }


    .search:focus {
      border-color: #111111;
      background: #ffffff;
    }


    .search::placeholder {
      color: #777777;
    }


    .search-button {
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }


    .search-button:hover {
      background: #333333;
    }


    /* HEADINGS */

    h2 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #111111;
    }


    /* POPULAR SKILLS */

    .skills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }


    .skill {
      border: 1px solid #d0d0d0;
      background: #f2f2f2;
      color: #111111;
      padding: 16px 10px;
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }


    .skill:hover {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }


    /* DESCRIPTION */

    .description {
      font-size: 16px;
      line-height: 1.5;
      color: #555555;
      margin-bottom: 20px;
    }


    /* MAIN BUTTON */

    .primary-button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }


    .primary-button:hover {
      background: #333333;
    }


    /* PAGES */

    .page {
      display: none;
    }


    .page.active {
      display: block;
    }


    /* BACK BUTTON */

    .back {
      border: none;
      background: none;
      color: #555555;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 22px;
      padding: 0;
    }


    .back:hover {
      color: #111111;
    }


    /* FORM */

    .field {
      width: 100%;
      padding: 14px 15px;
      margin-bottom: 14px;
      border: 1px solid #c8c8c8;
      border-radius: 10px;
      background: #f7f7f7;
      color: #111111;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }


    .field:focus {
      border-color: #111111;
      background: #ffffff;
    }


    textarea.field {
      min-height: 120px;
      resize: vertical;
    }


    .field::placeholder {
      color: #777777;
    }


    /* MESSAGE */

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #555555;
    }


    /* PROFILE CARDS */

    .profile-card {
      padding: 18px;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      margin-bottom: 14px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }


    .profile-card:hover {
      border-color: #999999;
    }


    .profile-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }


    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #111111;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }


    .profile-name {
      font-size: 18px;
      font-weight: 700;
      color: #111111;
    }


    .profile-skill {
      font-size: 14px;
      color: #666666;
      margin-top: 3px;
    }


    .profile-description {
      color: #444444;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 14px;
    }


    .price-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }


    .price {
      background: #eeeeee;
      color: #222222;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }


    /* MOBILE */

    @media (max-width: 380px) {

      .app {
        padding: 20px 14px 35px;
      }

      .search-button {
        padding: 0 13px;
      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- HOME PAGE -->

  <section
    id="homePage"
    class="page active"
  >


    <div class="logo">
      GoSkill
    </div>


    <!-- SEARCH -->

    <div class="search-container">

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Search for a skill or profession..."
      >

      <button
        class="search-button"
        onclick="performSearch()"
      >
        Search
      </button>

    </div>


    <!-- POPULAR SKILLS -->

    <h2>
      Popular Skills
    </h2>


    <div class="skills">


      <button
        class="skill"
        onclick="searchSkill('Video Editor')"
      >
        Video Editor
      </button>


      <button
        class="skill"
        onclick="searchSkill('Graphic Designer')"
      >
        Graphic Designer
      </button>


      <button
        class="skill"
        onclick="searchSkill('Developer')"
      >
        Developer
      </button>


      <button
        class="skill"
        onclick="searchSkill('Photographer')"
      >
        Photographer
      </button>


    </div>


    <p class="description">
      Find the right person for your project.
    </p>


    <button
      class="primary-button"
      onclick="showPage('profilePage')"
    >
      Offer Your Skill
    </button>


  </section>



  <!-- CREATE PROFILE PAGE -->

  <section
    id="profilePage"
    class="page"
  >


    <button
      class="back"
      onclick="showPage('homePage')"
    >
      ← Back
    </button>


    <h2>
      Create Your Profile
    </h2>


    <br>


    <input
      id="name"
      class="field"
      type="text"
      placeholder="Enter your full name"
    >


    <input
      id="skill"
      class="field"
      type="text"
      placeholder="What is your skill or profession?"
    >


    <textarea
      id="description"
      class="field"
      placeholder="Tell people about your skill"
    ></textarea>


    <input
      id="hourlyPrice"
      class="field"
      type="number"
      placeholder="Hourly price"
    >


    <input
      id="projectPrice"
      class="field"
      type="number"
      placeholder="Project price"
    >


    <button
      class="primary-button"
      onclick="createProfile()"
    >
      Create Profile
    </button>


    <p
      id="profileMessage"
      class="message"
    ></p>


  </section>



  <!-- RESULTS PAGE -->

  <section
    id="resultsPage"
    class="page"
  >


    <button
      class="back"
      onclick="showPage('homePage')"
    >
      ← Back
    </button>


    <h2>
      People on GoSkill
    </h2>


    <br>


    <div
      id="profilesList"
    ></div>


  </section>


</div>



<script>


  /*
    SUPABASE CONNECTION

    IMPORTANT:
    Replace these with your actual
    Supabase API URL and Publishable key.

    NEVER use the Secret key here.
  */


  const SUPABASE_URL =
    "https://ffovbypaoltxuuycppgo.supabase.co/rest/v1/";


  const SUPABASE_KEY =
    "sb_publishable_SNuI9r78c55zT8EgryTK_A_bLrkpuUQ
";



  /*
    PAGE NAVIGATION
  */


  function showPage(pageId) {


    document
      .querySelectorAll(".page")
      .forEach(
        page => {

          page.classList.remove(
            "active"
          );

        }
      );


    document
      .getElementById(pageId)
      .classList.add("active");


    window.scrollTo(
      0,
      0
    );

  }



  /*
    CREATE PROFILE
  */


  async function createProfile() {


    const name =
      document
        .getElementById("name")
        .value
        .trim();


    const skill =
      document
        .getElementById("skill")
        .value
        .trim();


    const description =
      document
        .getElementById("description")
        .value
        .trim();


    const hourlyPrice =
      document
        .getElementById("hourlyPrice")
        .value;


    const projectPrice =
      document
        .getElementById("projectPrice")
        .value;


    const message =
      document
        .getElementById(
          "profileMessage"
        );



    if (
      !name ||
      !skill
    ) {

      message.textContent =
        "Please enter your name and skill.";

      return;

    }



    message.textContent =
      "Saving profile...";



    try {


      const response =
        await fetch(

          SUPABASE_URL +
          "/profiles",

          {

            method: "POST",


            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Prefer":
                "return=minimal"

            },


            body:
              JSON.stringify({

                name: name,

                skill: skill,

                description:
                  description,

                hourly_price:
                  hourlyPrice
                  ? Number(
                      hourlyPrice
                    )
                  : null,

                project_price:
                  projectPrice
                  ? Number(
                      projectPrice
                    )
                  : null,

                created_at:
                  new Date()
                    .toISOString()

              })

          }

        );



      if (
        !response.ok
      ) {


        const error =
          await response.text();


        console.error(
          "Supabase error:",
          error
        );


        message.textContent =
          "Could not save profile. Check the database settings.";


        return;

      }



      message.textContent =
        "Profile created successfully!";



      document
        .getElementById("name")
        .value = "";


      document
        .getElementById("skill")
        .value = "";


      document
        .getElementById(
          "description"
        )
        .value = "";


      document
        .getElementById(
          "hourlyPrice"
        )
        .value = "";


      document
        .getElementById(
          "projectPrice"
        )
        .value = "";


    }


    catch (error) {


      console.error(
        "Connection error:",
        error
      );


      message.textContent =
        "Connection error. Please try again.";

    }

  }



  /*
    SEARCH
  */


  async function searchSkill(
    skill
  ) {


    showPage(
      "resultsPage"
    );


    const list =
      document
        .getElementById(
          "profilesList"
        );


    list.innerHTML =
      "Searching...";


    try {


      const url =
        SUPABASE_URL +
        "/profiles?select=*&skill=ilike." +
        encodeURIComponent(
          "*" +
          skill +
          "*"
        );


      console.log(
        "Search URL:",
        url
      );


      const response =
        await fetch(

          url,

          {

            method: "GET",

            headers: {

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY

            }

          }

        );



      if (
        !response.ok
      ) {


        const error =
          await response.text();


        console.error(
          "Supabase search error:",
          error
        );


        list.innerHTML =
          "<p>Could not load profiles.</p>";


        return;

      }



      const profiles =
        await response.json();


      console.log(
        "Profiles found:",
        profiles
      );


      displayProfiles(
        profiles
      );


    }


    catch (error) {


      console.error(
        "Search connection error:",
        error
      );


      list.innerHTML =
        "<p>Could not load profiles.</p>";

    }

  }



  /*
    SEARCH BUTTON + ENTER
  */


  function performSearch() {


    const skill =
      document
        .getElementById(
          "searchInput"
        )
        .value
        .trim();


    if (
      skill
    ) {

      searchSkill(
        skill
      );

    }

  }



  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      function(event) {


        if (
          event.key ===
          "Enter"
        ) {


          event.preventDefault();


          performSearch();

        }

      }
    );



  /*
    DISPLAY PROFILES
  */


  function displayProfiles(
    profiles
  ) {


    const list =
      document
        .getElementById(
          "profilesList"
        );


    if (
      !profiles ||
      profiles.length === 0
    ) {


      list.innerHTML =
        "<p>No profiles found yet.</p>";


      return;

    }



    list.innerHTML =
      "";



    profiles.forEach(
      profile => {


        const card =
          document
            .createElement(
              "div"
            );


        card.className =
          "profile-card";


        const firstLetter =
          profile.name
          ? profile.name
              .charAt(0)
              .toUpperCase()
          : "?";



        card.innerHTML = `

          <div
            class="profile-top"
          >

            <div
              class="profile-avatar"
            >
              ${escapeHtml(
                firstLetter
              )}
            </div>


            <div>

              <div
                class="profile-name"
              >
                ${escapeHtml(
                  profile.name
                )}
              </div>


              <div
                class="profile-skill"
              >
                ${escapeHtml(
                  profile.skill
                )}
              </div>

            </div>

          </div>


          <div
            class="profile-description"
          >
            ${escapeHtml(
              profile.description ||
              ""
            )}
          </div>


          <div
            class="price-row"
          >


            ${
              profile.hourly_price
              ? `
                <div
                  class="price"
                >
                  ₹${profile.hourly_price}/hr
                </div>
              `
              : ""
            }


            ${
              profile.project_price
              ? `
                <div
                  class="price"
                >
                  ₹${profile.project_price} project
                </div>
              `
              : ""
            }


          </div>

        `;


        list.appendChild(
          card
        );

      }
    );

  }



  /*
    HTML SAFETY
  */


  function escapeHtml(
    value
  ) {


    const div =
      document
        .createElement(
          "div"
        );


    div.textContent =
      value || "";


    return div.innerHTML;

  }


</script>


</body>

</html>
