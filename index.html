<script>

/* =========================
   SUPABASE
   ========================= */

const SUPABASE_URL =
  "https://ffovbypaoltxuuycppgo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_SNuI9r78c55zT8EgryTK_A_bLrkpuUQ";


/* =========================
   STATE
   ========================= */

let currentUser = null;
let accessToken = null;
let selectedAvatarFile = null;
let selectedProfile = null;


/* =========================
   PAGE NAVIGATION
   ========================= */

function showPage(pageId) {

  document
    .querySelectorAll(".page")
    .forEach(function(page) {
      page.classList.remove("active");
    });

  const page =
    document.getElementById(pageId);

  if (page) {
    page.classList.add("active");
  }

  window.scrollTo(0, 0);
}


/* =========================
   AUTH UI
   ========================= */

function updateAuthUI() {

  const authButtons =
    document.getElementById("authButtons");

  const userArea =
    document.getElementById("userArea");

  const userEmail =
    document.getElementById("userEmail");


  if (currentUser) {

    authButtons.style.display = "none";
    userArea.style.display = "flex";

    userEmail.textContent =
      currentUser.email || "";

  } else {

    authButtons.style.display = "flex";
    userArea.style.display = "none";

    userEmail.textContent = "";
  }
}


/* =========================
   SIGN UP
   ========================= */

async function signUp() {

  const email =
    document
      .getElementById("signupEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("signupPassword")
      .value;

  const confirmPassword =
    document
      .getElementById("signupPasswordConfirm")
      .value;

  const message =
    document.getElementById("signupMessage");


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  if (password !== confirmPassword) {

    message.textContent =
      "Passwords do not match.";

    return;
  }


  if (password.length < 6) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;
  }


  message.textContent =
    "Creating account...";


  try {

    const response =
      await fetch(
        SUPABASE_URL + "/auth/v1/signup",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({

            email: email,

            password: password,

            options: {
              emailRedirectTo:
                "https://goskill-nine.vercel.app/"
            }

          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      console.error(
        "Signup error:",
        data
      );

      message.textContent =
        data.message ||
        data.error_description ||
        data.msg ||
        "Could not create account.";

      return;
    }


    if (data.access_token) {

      accessToken =
        data.access_token;

      currentUser =
        data.user;

      updateAuthUI();

      showPage("homePage");

    } else {

      message.textContent =
        "Account created. Check your email to confirm your account.";
    }


  } catch (error) {

    console.error(
      "Signup connection error:",
      error
    );

    message.textContent =
      "Connection error. Please try again.";
  }
}


/* =========================
   LOGIN
   ========================= */

async function login() {

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;
  }


  message.textContent =
    "Logging in...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      console.error(
        "Login error:",
        data
      );

      message.textContent =
        data.error_description ||
        data.msg ||
        "Invalid email or password.";

      return;
    }


    accessToken =
      data.access_token;

    currentUser =
      data.user;

    updateAuthUI();

    showPage("homePage");


  } catch (error) {

    console.error(
      "Login connection error:",
      error
    );

    message.textContent =
      "Connection error. Please try again.";
  }
}


/* =========================
   LOGOUT
   ========================= */

function logout() {

  currentUser = null;
  accessToken = null;
  selectedAvatarFile = null;

  updateAuthUI();

  showPage("homePage");
}


/* =========================
   AVATAR PREVIEW
   ========================= */

document
  .getElementById("avatarInput")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      const preview =
        document.getElementById(
          "avatarPreview"
        );


      if (!file) {
        return;
      }


      if (file.size > 5 * 1024 * 1024) {

        alert(
          "Please choose an image smaller than 5MB."
        );

        event.target.value = "";
        selectedAvatarFile = null;

        return;
      }


      if (
        ![
          "image/jpeg",
          "image/png",
          "image/webp"
        ].includes(file.type)
      ) {

        alert(
          "Please choose a JPG, PNG or WebP image."
        );

        event.target.value = "";
        selectedAvatarFile = null;

        return;
      }


      selectedAvatarFile = file;


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          preview.className =
            "avatar-preview";

          preview.innerHTML =
            "";

          preview.style.backgroundImage =
            "url('" +
            e.target.result +
            "')";

          preview.style.backgroundSize =
            "cover";

          preview.style.backgroundPosition =
            "center";
        };


      reader.readAsDataURL(file);
    }
  );


/* =========================
   UPLOAD AVATAR
   ========================= */

async function uploadAvatar() {

  if (!selectedAvatarFile || !currentUser) {
    return null;
  }


  const file =
    selectedAvatarFile;


  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const filePath =
    currentUser.id +
    "/" +
    Date.now() +
    "." +
    extension;


  const response =
    await fetch(
      SUPABASE_URL +
      "/storage/v1/object/avatars/" +
      filePath,
      {
        method: "POST",

        headers: {

          "Authorization":
            "Bearer " +
            accessToken,

          "apikey":
            SUPABASE_KEY,

          "Content-Type":
            file.type,

          "x-upsert":
            "true"
        },

        body: file
      }
    );


  if (!response.ok) {

    const error =
      await response.text();

    console.error(
      "Avatar upload error:",
      error
    );

    throw new Error(
      "Could not upload profile photo."
    );
  }


  return (
    SUPABASE_URL +
    "/storage/v1/object/public/avatars/" +
    filePath
  );
}


/* =========================
   CREATE PROFILE
   ========================= */

async function createProfile() {

  if (!currentUser) {

    alert(
      "Please log in before creating a profile."
    );

    showPage("loginPage");

    return;
  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const skill =
    document
      .getElementById("skill")
      .value
      .trim();

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const hourlyPrice =
    document
      .getElementById("hourlyPrice")
      .value;

  const projectPrice =
    document
      .getElementById("projectPrice")
      .value;

  const message =
    document.getElementById(
      "profileMessage"
    );


  if (!name || !skill) {

    message.textContent =
      "Please enter your name and skill.";

    return;
  }


  message.textContent =
    "Saving profile...";


  try {

    let avatarUrl = null;


    if (selectedAvatarFile) {

      message.textContent =
        "Uploading profile photo...";

      avatarUrl =
        await uploadAvatar();
    }


    message.textContent =
      "Saving profile...";


    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles",
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken,

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({

            name: name,

            skill: skill,

            description: description,

            hourly_price:
              hourlyPrice
                ? Number(hourlyPrice)
                : null,

            project_price:
              projectPrice
                ? Number(projectPrice)
                : null,

            user_id:
              currentUser.id,

            avatar_url:
              avatarUrl,

            created_at:
              new Date().toISOString()

          })
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(
        "Profile error:",
        error
      );

      message.textContent =
        "Could not save profile. Check your database policies.";

      return;
    }


    message.textContent =
      "Profile created successfully!";


    document.getElementById("name").value = "";
    document.getElementById("skill").value = "";
    document.getElementById("description").value = "";
    document.getElementById("hourlyPrice").value = "";
    document.getElementById("projectPrice").value = "";
    document.getElementById("avatarInput").value = "";

    selectedAvatarFile = null;


    const preview =
      document.getElementById(
        "avatarPreview"
      );


    preview.className =
      "avatar-preview avatar-placeholder";

    preview.style.backgroundImage =
      "none";

    preview.innerHTML =
      "+";


  } catch (error) {

    console.error(
      "Profile connection error:",
      error
    );

    message.textContent =
      error.message ||
      "Connection error. Please try again.";
  }
}


/* =========================
   SEARCH
   ========================= */

async function searchSkill(skill) {

  if (!skill) {
    return;
  }


  showPage("resultsPage");


  const list =
    document.getElementById(
      "profilesList"
    );


  list.innerHTML =
    "<p>Searching...</p>";


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/profiles?select=*&skill=ilike." +
      encodeURIComponent("*" + skill + "*");


    const response =
      await fetch(
        url,
        {
          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      console.error(
        "Search error:",
        error
      );

      list.innerHTML =
        "<p>Could not load profiles.</p>";

      return;
    }


    const profiles =
      await response.json();


    displayProfiles(profiles);


  } catch (error) {

    console.error(
      "Search connection error:",
      error
    );

    list.innerHTML =
      "<p>Could not load profiles.</p>";
  }
}


/* =========================
   DISPLAY PROFILES
   ========================= */

function displayProfiles(profiles) {

  const list =
    document.getElementById(
      "profilesList"
    );


  if (
    !profiles ||
    profiles.length === 0
  ) {

    list.innerHTML =
      "<p>No profiles found yet.</p>";

    return;
  }


  list.innerHTML = "";


  profiles.forEach(function(profile) {

    const card =
      document.createElement("div");

    card.className =
      "profile-card";


    const top =
      document.createElement("div");

    top.className =
      "profile-top";


    const avatar =
      document.createElement("div");

    avatar.className =
      "profile-avatar";


    if (profile.avatar_url) {

      const image =
        document.createElement("img");

      image.src =
        profile.avatar_url;

      image.alt =
        profile.name ||
        "Profile photo";

      avatar.appendChild(image);

    } else {

      avatar.textContent =
        profile.name
          ? profile.name
              .charAt(0)
              .toUpperCase()
          : "?";
    }


    const info =
      document.createElement("div");


    const name =
      document.createElement("div");

    name.className =
      "profile-name";

    name.textContent =
      profile.name || "";


    const skill =
      document.createElement("div");

    skill.className =
      "profile-skill";

    skill.textContent =
      profile.skill || "";


    info.appendChild(name);
    info.appendChild(skill);

    top.appendChild(avatar);
    top.appendChild(info);


    const divider =
      document.createElement("div");

    divider.className =
      "profile-divider";


    const description =
      document.createElement("div");

    description.className =
      "profile-description";

    description.textContent =
      profile.description ||
      "No description provided.";


    const prices =
      document.createElement("div");

    prices.className =
      "price-row";


    if (
      profile.hourly_price !== null &&
      profile.hourly_price !== undefined
    ) {

      const hourly =
        document.createElement("div");

      hourly.className =
        "price";

      hourly.textContent =
        "₹" +
        profile.hourly_price +
        "/hr";

      prices.appendChild(hourly);
    }


    if (
      profile.project_price !== null &&
      profile.project_price !== undefined
    ) {

      const project =
        document.createElement("div");

      project.className =
        "price";

      project.textContent =
        "₹" +
        profile.project_price +
        " project";

      prices.appendChild(project);
    }


    const verified =
      document.createElement("div");

    verified.className =
      "verified-text";

    verified.style.marginTop =
      "12px";

    verified.textContent =
      "GoSkill member";


    const viewButton =
      document.createElement("button");

    viewButton.className =
      "view-profile-button";

    viewButton.type =
      "button";

    viewButton.textContent =
      "View Profile";


    viewButton.addEventListener(
      "click",
      function() {
        openProfileDetail(profile);
      }
    );


    card.appendChild(top);
    card.appendChild(divider);
    card.appendChild(description);
    card.appendChild(prices);
    card.appendChild(verified);
    card.appendChild(viewButton);

    list.appendChild(card);

  });
}


/* =========================

  const name =

  const skill =

  skill.className =

  const description =
    document.createElement("div");

  description.className =

  description.textContent =

  const prices =
    document.createElement("div");

  prices.className =

  if (
    profile.hourly_price !== null &&

  ) {

    const hourly =
      document.createElement("div");

      '<span class="detail-price-value">₹' +

      '</span>';

    prices.appendChild(project);
  }


  const contactBox =
    document.createElement("div");

  contactBox.className =
    "contact-box";

  const hireButton =
    document.createElement("button");

  hireButton.className =
    "primary-button";

  hireButton.type =
    "button";

  hireButton.style.marginTop =
    "20px";

  hireButton.textContent =
    "Contact / Hire";


  hireButton.addEventListener(
    "click",
    function() {
      openContactModal(profile);

  );


  card.appendChild(avatar);
  card.appendChild(name);
  card.appendChild(skill);
  card.appendChild(description);
  card.appendChild(prices);
  card.appendChild(contactBox);
  card.appendChild(hireButton);


  detail.appendChild(card);


  showPage("detailPage");
}


/* =========================
   CONTACT MODAL
   ========================= */

function openContactModal(profile) {

  selectedProfile =
    profile;


  const modal =
    document.getElementById(
      "contactModal"
    );


  const subtitle =
    document.getElementById(
      "contactSubtitle"
    );


  subtitle.textContent =
    "Send a project request regarding " +
    (profile.name || "this professional") +
    ".";


  document.getElementById(
    "contactStatus"
  ).textContent =
    "";


  modal.classList.add("active");
}


function closeContactModal() {

  document
    .getElementById("contactModal")
    .classList.remove("active");
}


/* =========================
   SEND HIRE REQUEST
   ========================= */

async function sendContactRequest() {

  const name =
    document
      .getElementById("contactName")
      .value
      .trim();

  const email =
    document
      .getElementById("contactEmail")
      .value
      .trim();

  const message =
    document
      .getElementById("contactMessage")
      .value
      .trim();

  const status =
    document.getElementById(
      "contactStatus"
    );


  if (!name || !email || !message) {

    status.textContent =
      "Please fill in all fields.";

    return;
  }


  if (!selectedProfile) {

    status.textContent =
      "Profile information is unavailable.";

    return;
  }


  if (!selectedProfile.user_id) {

    status.textContent =
      "This freelancer profile is missing account information.";

    return;
  }


  status.textContent =
    "Sending request...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/functions/v1/super-action",
        {
          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              accessToken
          },

          body: JSON.stringify({

            freelancerId:
              selectedProfile.user_id,

            clientName:
              name,

            clientEmail:
              email,

            message:
              message

          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      console.error(
        "Hire request error:",
        data
      );

      status.textContent =
        data.error ||
        "Could not send the request.";

      return;
    }


    status.textContent =
      "Request sent successfully!";


    document
      .getElementById("contactName")
      .value = "";

    document
      .getElementById("contactEmail")
      .value = "";

    document
      .getElementById("contactMessage")
      .value = "";


  } catch (error) {

    console.error(
      "Hire request connection error:",
      error
    );

    status.textContent =
      "Could not send the request. Please try again.";
  }
}

  .getElementById("sendContactButton")

      ) {

  );


/* =========================

   ========================= */

updateAuthUI();

console.log(

);

</script>
