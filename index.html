<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GoSkill</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }


    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px 40px;
      background: #ffffff;
    }


    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 24px;
    }


    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }


    .logo-small {
      font-size: 28px;
      font-weight: 800;
    }


    .auth-buttons {
      display: flex;
      gap: 8px;
    }


    .small-button {
      padding: 9px 12px;
      border: 1px solid #cccccc;
      border-radius: 9px;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
      font-family: inherit;
    }


    .small-button.dark {
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }


    .small-button:hover {
      background: #eeeeee;
    }


    .small-button.dark:hover {
      background: #333333;
    }


    .user-area {
      display: none;
      align-items: center;
      gap: 8px;
    }


    .user-email {
      font-size: 13px;
      color: #555555;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }


    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }


    .search {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #bbbbbb;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111111;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }


    .search:focus {
      background: #ffffff;
      border-color: #111111;
    }


    .search-button {
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }


    .search-button:hover {
      background: #333333;
    }


    h2 {
      font-size: 21px;
      margin-bottom: 16px;
    }


    .skills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }


    .skill {
      padding: 16px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      background: #f2f2f2;
      color: #111111;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
    }


    .skill:hover {
      background: #111111;
      color: #ffffff;
    }


    .description {
      margin-bottom: 20px;
      color: #555555;
      line-height: 1.5;
    }


    .primary-button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }


    .primary-button:hover {
      background: #333333;
    }


    .page {
      display: none;
    }


    .page.active {
      display: block;
    }


    .back {
      border: 0;
      background: transparent;
      color: #555555;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 15px;
      font-family: inherit;
    }


    .field {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      background: #f7f7f7;
      color: #111111;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }


    .field:focus {
      background: #ffffff;
      border-color: #111111;
    }


    textarea.field {
      min-height: 120px;
      resize: vertical;
    }


    .message {
      margin-top: 14px;
      font-size: 14px;
      color: #555555;
      line-height: 1.5;
    }


    .auth-switch {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: #555555;
    }


    .text-button {
      border: 0;
      background: transparent;
      color: #111111;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }


    .profile-card {
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }


    .profile-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }


    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }


    .profile-name {
      font-size: 18px;
      font-weight: 700;
    }


    .profile-skill {
      margin-top: 3px;
      color: #666666;
      font-size: 14px;
    }


    .profile-description {
      margin-bottom: 14px;
      color: #444444;
      font-size: 14px;
      line-height: 1.5;
    }


    .price-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }


    .price {
      padding: 7px 10px;
      border-radius: 8px;
      background: #eeeeee;
      color: #222222;
      font-size: 13px;
      font-weight: 600;
    }

  </style>

</head>


<body>


<div class="app">


  <!-- HOME -->

  <section
    id="homePage"
    class="page active"
  >


    <div class="top-bar">

      <div class="logo-small">

      <div

      >

        <button

        >
          Log In
        </button>


        <button
          id="signupButton"
          class="small-button dark"
          type="button"
        >
          Sign Up

      </div>


      <div
        id="userArea"
        class="user-area"
      >

        <span
          id="userEmail"
          class="user-email"
        ></span>


        <button
          id="logoutButton"
          class="small-button dark"
          type="button"
        >
          Log Out
        </button>

      </div>

    </div>


    <div class="search-container">

      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Search for a skill or profession..."
      >


      <button
        id="searchButton"
        class="search-button"

      >
        Search

    </div>


    <h2>
      Popular Skills
    </h2>


    <div class="skills">


      <button
        class="skill"
        type="button"
        data-skill="Video Editor"
      >
        Video Editor
      </button>


      <button
        class="skill"
        type="button"
        data-skill="Graphic Designer"
      >
        Graphic Designer
      </button>


      <button
        class="skill"
        type="button"
        data-skill="Developer"
      >
        Developer
      </button>


      <button
        class="skill"
        type="button"
        data-skill="Photographer"
      >
        Photographer
      </button>


    </div>


    <p class="description">
      Find the right person for your project.
    </p>


    <button
      id="offerButton"
      class="primary-button"
      type="button"
    >
      Offer Your Skill
    </button>


  </section>



  <!-- LOGIN -->

  <section
    id="loginPage"
    class="page"
  >


    <button
      id="loginBackButton"
      class="back"
      type="button"
    >
      ← Back
    </button>


    <h2>
      Log In
    </h2>


    <br>


    <input
      id="loginEmail"

      type="email"
      placeholder="Email address"
    >


    <input
      id="loginPassword"
      class="field"
      type="password"
      placeholder="Password"
    >


    <button
      id="doLoginButton"
      class="primary-button"
      type="button"
    >
      Log In
    </button>


    <p
      id="loginMessage"
      class="message"
    ></p>


    <div class="auth-switch">

      Don't have an account?

      <button
        id="switchToSignup"
        class="text-button"
        type="button"
      >
        Sign Up
      </button>

    </div>


  </section>



  <!-- SIGN UP -->

  <section
    id="signupPage"
    class="page"
  >


    <button
      id="signupBackButton"
      class="back"
      type="button"
    >
      ← Back
    </button>


    <h2>
      Create Account
    </h2>


    <br>


    <input
      id="signupEmail"
      class="field"
      type="email"
      placeholder="Email address"
    >


    <input
      id="signupPassword"
      class="field"
      type="password"
      placeholder="Password"
    >


    <input
      id="signupPasswordConfirm"
      class="field"
      type="password"
      placeholder="Confirm password"
    >


    <button
      id="doSignupButton"
      class="primary-button"
      type="button"
    >
      Sign Up
    </button>


    <p
      id="signupMessage"
      class="message"
    ></p>


    <div class="auth-switch">

      Already have an account?

      <button
        id="switchToLogin"
        class="text-button"
        type="button"
      >
        Log In
      </button>

    </div>


  </section>



  <!-- CREATE PROFILE -->

  <section
    id="profilePage"
    class="page"
  >


    <button
      id="profileBackButton"
      class="back"
      type="button"
    >
      ← Back
    </button>


    <h2>
      Create Your Profile
    </h2>


    <br>


    <input
      id="name"
      class="field"
      type="text"
      placeholder="Enter your full name"
    >


    <input
      id="skill"
      class="field"
      type="text"
      placeholder="What is your skill or profession?"
    >


    <textarea
      id="description"
      class="field"
      placeholder="Tell people about your skill"
    ></textarea>


    <input
      id="hourlyPrice"
      class="field"
      type="number"
      placeholder="Hourly price"
    >


    <input
      id="projectPrice"
      class="field"
      type="number"
      placeholder="Project price"
    >


    <button
      id="createProfileButton"
      class="primary-button"
      type="button"
    >
      Create Profile
    </button>


    <p
      id="profileMessage"
      class="message"
    ></p>


  </section>



  <!-- RESULTS -->

  <section
    id="resultsPage"
    class="page"
  >


    <button
      id="resultsBackButton"
      class="back"
      type="button"
    >
      ← Back
    </button>


    <h2>
      People on GoSkill
    </h2>


    <br>


    <div
      id="profilesList"
    ></div>


  </section>


</div>



<script>


/* =========================
   SUPABASE
   ========================= */


const SUPABASE_URL =
  "https://ffovbypaoltxuuycppgo.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_SNuI9r78c55zT8EgryTK_A_bLrkpuUQ";


/*
   IMPORTANT:
   Replace only YOUR_PUBLISHABLE_KEY_HERE
   with your Supabase Publishable key.

   Keep it on ONE line.
*/


/* =========================
   SUPABASE AUTH REQUEST
   ========================= */


async function authRequest(
  endpoint,
  body
) {

  return fetch(
    SUPABASE_URL +
    "/auth/v1/" +
    endpoint,
    {

      method: "POST",

      headers: {

        "Content-Type":
          "application/json",

        "apikey":
          SUPABASE_KEY

      },

      body:
        JSON.stringify(body)

    }
  );

}


/* =========================
   PAGE NAVIGATION
   ========================= */


function showPage(
  pageId
) {

  document
    .querySelectorAll(".page")
    .forEach(
      function(page) {

        page.classList.remove(
          "active"
        );

      }
    );


  const page =
    document.getElementById(
      pageId
    );


  if (page) {

    page.classList.add(
      "active"
    );

  }


  window.scrollTo(
    0,
    0
  );

}


/* =========================
   AUTH STATE
   ========================= */


let currentUser = null;

let accessToken = null;



function updateAuthUI() {

  const authButtons =
    document.getElementById(
      "authButtons"
    );


  const userArea =
    document.getElementById(
      "userArea"
    );


  const userEmail =
    document.getElementById(
      "userEmail"
    );


  if (currentUser) {

    authButtons.style.display =
      "none";


    userArea.style.display =
      "flex";


    userEmail.textContent =
      currentUser.email || "";

  } else {

    authButtons.style.display =
      "flex";


    userArea.style.display =
      "none";


    userEmail.textContent =
      "";

  }

}


/* =========================
   SIGN UP
   ========================= */


async function signUp() {

  const email =
    document
      .getElementById(
        "signupEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "signupPassword"
      )
      .value;


  const confirmPassword =
    document
      .getElementById(
        "signupPasswordConfirm"
      )
      .value;


  const message =
    document.getElementById(
      "signupMessage"
    );


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;

  }


  if (
    password !==
    confirmPassword
  ) {

    message.textContent =
      "Passwords do not match.";

    return;

  }


  if (
    password.length < 6
  ) {

    message.textContent =
      "Password must be at least 6 characters.";

    return;

  }


  message.textContent =
    "Creating account...";


  try {

    const response =
      await authRequest(
        "signup",
        {
          email: email,
          password: password
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      console.error(
        "Signup error:",
        data
      );


      message.textContent =
        data.message ||
        data.error_description ||
        "Could not create account.";

      return;

    }


    if (
      data.access_token
    ) {

      accessToken =
        data.access_token;

      currentUser =
        data.user;

      updateAuthUI();

      message.textContent =
        "Account created successfully!";

      showPage(
        "homePage"
      );

    } else {

      message.textContent =
        "Account created. Check your email to confirm your account.";

    }


  } catch (error) {

    console.error(
      "Signup connection error:",
      error
    );


    message.textContent =
      "Connection error. Please try again.";

  }

}


/* =========================
   LOGIN
   ========================= */


async function login() {

  const email =
    document
      .getElementById(
        "loginEmail"
      )
      .value
      .trim();


  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;


  const message =
    document.getElementById(
      "loginMessage"
    );


  if (!email || !password) {

    message.textContent =
      "Please enter your email and password.";

    return;

  }


  message.textContent =
    "Logging in...";


  try {

    const response =
      await authRequest(
        "token?grant_type=password",
        {
          email: email,
          password: password
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      console.error(
        "Login error:",
        data
      );


      message.textContent =
        data.error_description ||
        data.msg ||
        "Invalid email or password.";

      return;

    }


    accessToken =
      data.access_token;


    currentUser =
      data.user;


    updateAuthUI();


    message.textContent =
      "Logged in successfully!";


    showPage(
      "homePage"
    );


  } catch (error) {

    console.error(
      "Login connection error:",
      error
    );


    message.textContent =
      "Connection error. Please try again.";

  }

}


/* =========================
   LOGOUT
   ========================= */


function logout() {

  currentUser =
    null;


  accessToken =
    null;


  updateAuthUI();


  showPage(
    "homePage"
  );

}


/* =========================
   CREATE PROFILE
   ========================= */


async function createProfile() {

  if (!currentUser) {

    alert(
      "Please log in before creating a profile."
    );

    showPage(
      "loginPage"
    );

    return;

  }


  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const skill =
    document
      .getElementById("skill")
      .value
      .trim();


  const description =
    document
      .getElementById("description")
      .value
      .trim();


  const hourlyPrice =
    document
      .getElementById("hourlyPrice")
      .value;


  const projectPrice =
    document
      .getElementById("projectPrice")
      .value;


  const message =
    document.getElementById(
      "profileMessage"
    );


  if (!name || !skill) {

    message.textContent =
      "Please enter your name and skill.";

    return;

  }


  message.textContent =
    "Saving profile...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/profiles",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              name: name,

              skill: skill,

              description:
                description,

              hourly_price:
                hourlyPrice
                  ? Number(
                      hourlyPrice
                    )
                  : null,

              project_price:
                projectPrice
                  ? Number(
                      projectPrice
                    )
                  : null,

              user_id:
                currentUser.id,

              created_at:
                new Date()
                  .toISOString()

            })

        }
      );


    if (!response.ok) {

      const error =
        await response.text();


      console.error(
        "Profile error:",
        error
      );


      message.textContent =
        "Could not save profile. Check the database settings.";

      return;

    }


    message.textContent =
      "Profile created successfully!";


    document
      .getElementById("name")
      .value = "";


    document
      .getElementById("skill")
      .value = "";


    document
      .getElementById(
        "description"
      )
      .value = "";


    document
      .getElementById(
        "hourlyPrice"
      )
      .value = "";


    document
      .getElementById(
        "projectPrice"
      )
      .value = "";


  } catch (error) {

    console.error(
      "Profile connection error:",
      error
    );


    message.textContent =
      "Connection error. Please try again.";

  }

}


/* =========================
   SEARCH
   ========================= */


async function searchSkill(
  skill
) {

  if (!skill) {
    return;
  }


  showPage(
    "resultsPage"
  );


  const list =
    document.getElementById(
      "profilesList"
    );


  list.innerHTML =
    "<p>Searching...</p>";


  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/profiles?select=*&skill=ilike." +
      encodeURIComponent(
        "*" +
        skill +
        "*"
      );


    const response =
      await fetch(
        url,
        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }
      );


    if (!response.ok) {

      const error =
        await response.text();


      console.error(
        "Search error:",
        error
      );


      list.innerHTML =
        "<p>Could not load profiles.</p>";

      return;

    }


    const profiles =
      await response.json();


    displayProfiles(
      profiles
    );


  } catch (error) {

    console.error(
      "Search connection error:",
      error
    );


    list.innerHTML =
      "<p>Could not load profiles.</p>";

  }

}


/* =========================
   DISPLAY PROFILES
   ========================= */


function displayProfiles(
  profiles
) {

  const list =
    document.getElementById(
      "profilesList"
    );


  if (
    !profiles ||
    profiles.length === 0
  ) {

    list.innerHTML =
      "<p>No profiles found yet.</p>";

    return;

  }


  list.innerHTML =
    "";


  profiles.forEach(
    function(profile) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "profile-card";


      const top =
        document.createElement(
          "div"
        );


      top.className =
        "profile-top";


      const avatar =
        document.createElement(
          "div"
        );


      avatar.className =
        "profile-avatar";


      avatar.textContent =
        profile.name
          ? profile.name
              .charAt(0)
              .toUpperCase()
          : "?";


      const info =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );


      name.className =
        "profile-name";


      name.textContent =
        profile.name || "";


      const skill =
        document.createElement(
          "div"
        );


      skill.className =
        "profile-skill";


      skill.textContent =
        profile.skill || "";


      info.appendChild(
        name
      );


      info.appendChild(
        skill
      );


      top.appendChild(
        avatar
      );


      top.appendChild(
        info
      );


      const description =
        document.createElement(
          "div"
        );


      description.className =
        "profile-description";


      description.textContent =
        profile.description || "";


      const prices =
        document.createElement(
          "div"
        );


      prices.className =
        "price-row";


      if (
        profile.hourly_price
      ) {

        const hourly =
          document.createElement(
            "div"
          );


        hourly.className =
          "price";


        hourly.textContent =
          "₹" +
          profile.hourly_price +
          "/hr";


        prices.appendChild(
          hourly
        );

      }


      if (
        profile.project_price
      ) {

        const project =
          document.createElement(
            "div"
          );


        project.className =
          "price";


        project.textContent =
          "₹" +
          profile.project_price +
          " project";


        prices.appendChild(
          project
        );

      }


      card.appendChild(
        top
      );


      card.appendChild(
        description
      );


      card.appendChild(
        prices
      );


      list.appendChild(
        card
      );

    }
  );

}


/* =========================
   BUTTON EVENTS
   ========================= */


document

/* SEARCH BUTTON */


document
  .getElementById(
    "searchButton"
  )
  .addEventListener(
    "click",
    function() {

      const value =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim();


      searchSkill(
        value
      );

    }
  );


/* ENTER SEARCH */


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key ===
        "Enter"
      ) {

        event.preventDefault();


        searchSkill(
          event.target.value.trim()
        );

      }

    }
  );


/* POPULAR SKILLS */


document
  .querySelectorAll(
    ".skill"
  )
  .forEach(
    function(button) {

      button.addEventListener(
        "click",
        function() {

          searchSkill(
            button.dataset.skill
          );

        }
      );

    }
  );
