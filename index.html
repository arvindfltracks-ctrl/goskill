<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoSkill</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      margin: auto;
      padding: 24px 18px 40px;
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 24px;
    }

    .search-container {
      display: flex;
      gap: 8px;
      margin-bottom: 30px;
    }

    .search {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border: 1px solid #bbbbbb;
      border-radius: 12px;
      background: #f5f5f5;
      color: #111111;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      background: #ffffff;
      border-color: #111111;
    }

    .search-button {
      padding: 0 18px;
      border: 0;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
    }

    .search-button:hover {
      background: #333333;
    }

    h2 {
      font-size: 21px;
      margin-bottom: 16px;
    }

    .skills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 30px;
    }

    .skill {
      padding: 16px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      background: #f2f2f2;
      color: #111111;
      cursor: pointer;
      font-size: 15px;
    }

    .skill:hover {
      background: #111111;
      color: #ffffff;
    }

    .description {
      margin-bottom: 20px;
      color: #555555;
      line-height: 1.5;
    }

    .primary-button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #111111;
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .primary-button:hover {
      background: #333333;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .back {
      border: 0;
      background: transparent;
      color: #555555;
      cursor: pointer;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .field {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #cccccc;
      border-radius: 10px;
      background: #f7f7f7;
      color: #111111;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    .field:focus {
      background: #ffffff;
      border-color: #111111;
    }

    textarea.field {
      min-height: 120px;
      resize: vertical;
    }

    .message {
      margin-top: 14px;
      font-size: 14px;
      color: #555555;
    }

    .profile-card {
      padding: 18px;
      margin-bottom: 14px;
      border: 1px solid #d5d5d5;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .profile-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111111;
      color: #ffffff;
      font-weight: 700;
      font-size: 18px;
      flex-shrink: 0;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
    }

    .profile-skill {
      margin-top: 3px;
      color: #666666;
      font-size: 14px;
    }

    .profile-description {
      margin-bottom: 14px;
      color: #444444;
      font-size: 14px;
      line-height: 1.5;
    }

    .price-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .price {
      padding: 7px 10px;
      border-radius: 8px;
      background: #eeeeee;
      color: #222222;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HOME -->
  <section id="homePage" class="page active">

    <div class="logo">GoSkill</div>

    <div class="search-container">
      <input
        id="searchInput"
        class="search"
        type="text"
        placeholder="Search for a skill or profession..."
      >

      <button
        id="searchButton"
        class="search-button"
        type="button"
      >
        Search
      </button>
    </div>

    <h2>Popular Skills</h2>

    <div class="skills">

      <button
        class="skill"
        type="button"
        data-skill="Video Editor"
      >
        Video Editor
      </button>

      <button
        class="skill"
        type="button"
        data-skill="Graphic Designer"
      >
        Graphic Designer
      </button>

      <button
        class="skill"
        type="button"
        data-skill="Developer"
      >
        Developer
      </button>

      <button
        class="skill"
        type="button"
        data-skill="Photographer"
      >
        Photographer
      </button>

    </div>

    <p class="description">
      Find the right person for your project.
    </p>

    <button
      id="offerButton"
      class="primary-button"
      type="button"
    >
      Offer Your Skill
    </button>

  </section>


  <!-- CREATE PROFILE -->
  <section id="profilePage" class="page">

    <button
      id="profileBackButton"
      class="back"
      type="button"
    >
      ← Back
    </button>

    <h2>Create Your Profile</h2>

    <br>

    <input
      id="name"
      class="field"
      type="text"
      placeholder="Enter your full name"
    >

    <input
      id="skill"
      class="field"
      type="text"
      placeholder="What is your skill or profession?"
    >

    <textarea
      id="description"
      class="field"
      placeholder="Tell people about your skill"
    ></textarea>

    <input
      id="hourlyPrice"
      class="field"
      type="number"
      placeholder="Hourly price"
    >

    <input
      id="projectPrice"
      class="field"
      type="number"
      placeholder="Project price"
    >

    <button
      id="createProfileButton"
      class="primary-button"
      type="button"
    >
      Create Profile
    </button>

    <p
      id="profileMessage"
      class="message"
    ></p>

  </section>


  <!-- RESULTS -->
  <section id="resultsPage" class="page">

    <button
      id="resultsBackButton"
      class="back"
      type="button"
    >
      ← Back
    </button>

    <h2>People on GoSkill</h2>

    <br>

    <div id="profilesList"></div>

  </section>

</div>


<script>

  /*
   * SUPABASE
   *
   * IMPORTANT:
   * Put your API URL and Publishable key here.
   *
   * The key must stay on ONE LINE.
   */

  const SUPABASE_URL =
    "https://ffovbypaoltxuuycppgo.supabase.co/rest/v1";

  const SUPABASE_KEY =
    "sb_publishable_SNuI9r78c55zT8EgryTK_A_bLrkpuUQ";


  /*
   * PAGE NAVIGATION
   */

  function showPage(pageId) {

    const pages =
      document.querySelectorAll(".page");

    pages.forEach(function(page) {
      page.classList.remove("active");
    });

    const selectedPage =
      document.getElementById(pageId);

    if (selectedPage) {
      selectedPage.classList.add("active");
    }

    window.scrollTo(0, 0);
  }


  /*
   * SEARCH
   */

  async function searchSkill(skill) {

    if (!skill) {
      return;
    }

    showPage("resultsPage");

    const list =
      document.getElementById("profilesList");

    list.innerHTML = "<p>Searching...</p>";

    try {

      const url =
        SUPABASE_URL +
        "/profiles?select=*&skill=ilike." +
        encodeURIComponent("*" + skill + "*");

      console.log("Search URL:", url);

      const response =
        await fetch(url, {
          method: "GET",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

      if (!response.ok) {

        const error =
          await response.text();

        console.error(
          "Supabase search error:",
          error
        );

        list.innerHTML =
          "<p>Could not load profiles.</p>";

        return;
      }

      const profiles =
        await response.json();

      console.log(
        "Profiles found:",
        profiles
      );

      displayProfiles(profiles);

    } catch (error) {

      console.error(
        "Search error:",
        error
      );

      list.innerHTML =
        "<p>Could not load profiles.</p>";
    }
  }


  /*
   * DISPLAY PROFILES
   */

  function displayProfiles(profiles) {

    const list =
      document.getElementById("profilesList");

    if (
      !profiles ||
      profiles.length === 0
    ) {

      list.innerHTML =
        "<p>No profiles found yet.</p>";

      return;
    }

    list.innerHTML = "";

    profiles.forEach(function(profile) {

      const card =
        document.createElement("div");

      card.className =
        "profile-card";

      const firstLetter =
        profile.name
          ? profile.name.charAt(0).toUpperCase()
          : "?";

      const avatar =
        document.createElement("div");

      avatar.className =
        "profile-avatar";

      avatar.textContent =
        firstLetter;


      const top =
        document.createElement("div");

      top.className =
        "profile-top";


      const info =
        document.createElement("div");


      const name =
        document.createElement("div");

      name.className =
        "profile-name";

      name.textContent =
        profile.name || "";


      const skill =
        document.createElement("div");

      skill.className =
        "profile-skill";

      skill.textContent =
        profile.skill || "";


      info.appendChild(name);
      info.appendChild(skill);

      top.appendChild(avatar);
      top.appendChild(info);


      const description =
        document.createElement("div");

      description.className =
        "profile-description";

      description.textContent =
        profile.description || "";


      const prices =
        document.createElement("div");

      prices.className =
        "price-row";


      if (profile.hourly_price) {

        const hourly =
          document.createElement("div");

        hourly.className =
          "price";

        hourly.textContent =
          "₹" +
          profile.hourly_price +
          "/hr";

        prices.appendChild(hourly);
      }


      if (profile.project_price) {

        const project =
          document.createElement("div");

        project.className =
          "price";

        project.textContent =
          "₹" +
          profile.project_price +
          " project";

        prices.appendChild(project);
      }


      card.appendChild(top);
      card.appendChild(description);
      card.appendChild(prices);

      list.appendChild(card);

    });
  }


  /*
   * CREATE PROFILE
   */

  async function createProfile() {

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const skill =
      document
        .getElementById("skill")
        .value
        .trim();

    const description =
      document
        .getElementById("description")
        .value
        .trim();

    const hourlyPrice =
      document
        .getElementById("hourlyPrice")
        .value;

    const projectPrice =
      document
        .getElementById("projectPrice")
        .value;

    const message =
      document.getElementById(
        "profileMessage"
      );


    if (!name || !skill) {

      message.textContent =
        "Please enter your name and skill.";

      return;
    }


    message.textContent =
      "Saving profile...";


    try {

      const response =
        await fetch(
          SUPABASE_URL + "/profiles",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_KEY,

              "Prefer":
                "return=minimal"
            },

            body: JSON.stringify({

              name: name,

              skill: skill,

              description:
                description,

              hourly_price:
                hourlyPrice
                  ? Number(hourlyPrice)
                  : null,

              project_price:
                projectPrice
                  ? Number(projectPrice)
                  : null,

              created_at:
                new Date().toISOString()

            })
          }
        );


      if (!response.ok) {

        const error =
          await response.text();

        console.error(
          "Supabase error:",
          error
        );

        message.textContent =
          "Could not save profile. Check the database settings.";

        return;
      }


      message.textContent =
        "Profile created successfully!";


      document.getElementById("name").value = "";
      document.getElementById("skill").value = "";
      document.getElementById("description").value = "";
      document.getElementById("hourlyPrice").value = "";
      document.getElementById("projectPrice").value = "";


    } catch (error) {

      console.error(
        "Create profile error:",
        error
      );

      message.textContent =
        "Connection error. Please try again.";
    }
  }


  /*
   * SEARCH BUTTON
   */

  document
    .getElementById("searchButton")
    .addEventListener(
      "click",
      function() {

        const input =
          document.getElementById(
            "searchInput"
          );

        searchSkill(
          input.value.trim()
        );

      }
    );


  /*
   * ENTER KEY
   */

  document
    .getElementById("searchInput")
    .addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          searchSkill(
            event.target.value.trim()
          );
        }

      }
    );


  /*
   * POPULAR SKILLS
   */

  document
    .querySelectorAll(".skill")
    .forEach(function(button) {

      button.addEventListener(
        "click",
        function() {

          searchSkill(
            button.dataset.skill
          );

        }
      );

    });


  /*
   * OFFER YOUR SKILL
   */

  document
    .getElementById("offerButton")
    .addEventListener(
      "click",
      function() {

        showPage("profilePage");

      }
    );


  /*
   * BACK BUTTONS
   */

  document
    .getElementById("profileBackButton")
    .addEventListener(
      "click",
      function() {

        showPage("homePage");

      }
    );


  document
    .getElementById("resultsBackButton")
    .addEventListener(
      "click",
      function() {

        showPage("homePage");

      }
    );


  /*
   * CREATE PROFILE BUTTON
   */

  document
    .getElementById("createProfileButton")
    .addEventListener(
      "click",
      function() {

        createProfile();

      }
    );


  console.log(
    "GoSkill JavaScript loaded successfully."
  );

</script>

</body>
</html>
